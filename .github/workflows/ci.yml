name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-agent
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: device-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: device-agent/.coverage
          include-hidden-files: true

  shell:
    name: Shell contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The boot guard is the one component whose failure is unrecoverable in
      # the field, and it is shell. Cover it directly rather than relying on
      # the Python class that writes the files it reads.
      - name: ota-boot-guard.sh contract tests
        run: sh device-agent/tests/t_ota_boot_guard.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck device-agent/deploy/ota-boot-guard.sh device-agent/tests/t_ota_boot_guard.sh

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nothing previously executed publish_release.py, which is how a wrong
      # AWS CLI flag reached main with every other check green. A --dry-run
      # publish touches no AWS resource and exercises the real code path.
      - name: publish_release.py --dry-run checks
        run: bash tools/check_publish_release.sh

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit checkov

      - name: Bandit (Python static analysis)
        run: bandit -r device-agent publish_release.py -x device-agent/tests

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r device-agent/requirements.txt

      - name: Checkov (Terraform misconfigurations)
        run: checkov -d infrastructure --quiet --compact
